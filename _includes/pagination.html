{% if paginator and paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Article pages">
  {% if paginator.previous_page %}
    <a href="{{ paginator.previous_page_path | relative_url }}">← Newer</a>
  {% else %}<span class="pagination-disabled">← Newer</span>{% endif %}
  <span class="pagination-count">{{ paginator.page }} / {{ paginator.total_pages }}</span>
  {% if paginator.next_page %}
    <a href="{{ paginator.next_page_path | relative_url }}">Older →</a>
  {% else %}<span class="pagination-disabled">Older →</span>{% endif %}
</nav>
{% endif %}
